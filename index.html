        /* 中央柔光：让白色卡片更清晰，四周图案保持完整可见 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse 620px 660px at 50% 44%, rgba(255,255,255,0.52) 0%, rgba(255,255,255,0.18) 55%, rgba(255,255,255,0) 78%);
        }
        /* 卡片要在柔光层之上 */
        body > * { position: relative; z-index: 1; }

        .card {
            position: relative;
            display: flex; flex-direction: column;   /* 内部按需伸缩 */
            /* 比原来略高一点，但上限锁死在屏幕内：既不空一大片，也不会被顶出屏幕 */
            min-height: min(760px, calc(100vh - 56px));
            max-height: calc(100vh - 60px);
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(14px) saturate(1.1);
            padding: 26px 32px 32px 32px;
            border-radius: 32px;
            box-shadow: 0 18px 40px rgba(226, 92, 148, 0.35), 0 0 0 1px rgba(255,255,255,0.6) inset;
            text-align: center;
            width: 100%;
            max-width: 620px;
            border: 4px solid #ff9ec7;
        }
        .card::before {
            content: "";
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 6px;
            border-radius: 6px;
            background: linear-gradient(90deg, rgba(255,208,226,0.4), #ff6fa5, rgba(255,208,226,0.4));
        }

        /* ================= 美乐蒂形象（使用真实图片） ================= */
        .melody-box {
            width: 210px;
            height: 210px;
            margin: 6px auto 4px auto;
            border-radius: 28px;
            overflow: hidden;
            background: #fff;
            border: 4px solid #ffb3d1;
            box-shadow: 0 10px 24px rgba(226, 92, 148, 0.32);
            transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
        }
        .melody-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* 选中后的开心状态：轻轻跳动 */
        .melody-box.happy {
            border-color: #ff5c96;
            box-shadow: 0 12px 30px rgba(226, 92, 148, 0.5);
            animation: hop 1s ease-in-out infinite;
        }
        @keyframes hop {
            0%, 100% { transform: translateY(0)    scale(1)    rotate(0deg); }
            30%      { transform: translateY(-10px) scale(1.06) rotate(-2.5deg); }
            62%      { transform: translateY(-3px)  scale(1.03) rotate(2.5deg); }
        }

        h1 {
            font-size: 25px;
            color: #d63c7c;
            margin: 12px 0 15px 0;
            letter-spacing: 1px;
            font-weight: 700;
            text-shadow: 0 1px 0 #fff, 0 2px 6px rgba(255,255,255,0.9);
        }
        h1 .bow { font-size: 21px; }

        #result {
            font-size: 27px;
            font-weight: bold;
            color: #d63c7c;
            min-height: 82px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 240, 246, 0.95);
            border: 3px dashed #ff9ec7;
            border-radius: 22px;
            margin-bottom: 20px;
            padding: 8px 14px;
            line-height: 1.35;
            transition: all 0.25s ease;
        }
        #result.picked {
            background: linear-gradient(135deg, #ffe3ef, #ffcfe3);
            border-style: solid;
            border-color: #ff5c96;
            animation: pop 0.45s ease;
        }
        @keyframes pop {
            0%   { transform: scale(0.94); }
            60%  { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        button {
            background: linear-gradient(135deg, #ff8fb8 0%, #ff5c96 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 22px rgba(255, 92, 150, 0.45);
            width: 100%;
            letter-spacing: 1px;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 11px 28px rgba(255, 92, 150, 0.58);
            background: linear-gradient(135deg, #ff9ec7 0%, #ff4d8d 100%);
        }
        button:active { transform: scale(0.98); }

        /* 清单区占满中间的剩余空间 */
        .menu-container {
            display: flex; flex-direction: column; flex: 1 1 auto;
            margin-top: 20px;
            text-align: left;
        }
        .menu-title {
            font-size: 14px;
            font-weight: bold;
            color: #d63c7c;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-title span.last-hint {
            font-weight: normal; font-size: 11.5px; color: #c9a3b5; white-space: nowrap;
        }
        /* 展开"更多操作"时清单自动收短，保证整页不超出屏幕 */
        /* 展开"更多操作"时清单平滑收缩腾空间；必须同时压低 min-height，
           否则全局的 260px 最小高度会顶住它，导致收不下去 */
        body.tools-open .menu-list { min-height: 118px; max-height: 130px; }
        .menu-list {
            /* 占满中间剩余空间（并给一个最小高度，让它真的长起来），内容多了在框内滚动 */
            flex: 1 1 auto; min-height: 260px;
            transition: min-height .3s ease, max-height .3s ease;   /* 展开/收起时高度过渡自然 */
            font-size: 13.5px;
            color: #6b5560;
            -webkit-overflow-scrolling: touch;
            max-height: 250px;
            overflow-y: auto;
            background: rgba(255, 245, 249, 0.95);
            padding: 12px 15px;
            border-radius: 18px;
            line-height: 1.85;
            border: 1px solid #ffd0e4;
        }
        .menu-list::-webkit-scrollbar { width: 8px; }
        .menu-list::-webkit-scrollbar-track { background: #ffeaf3; border-radius: 8px; }
        .menu-list::-webkit-scrollbar-thumb { background: #ffb3d1; border-radius: 8px; }
        .menu-list::-webkit-scrollbar-thumb:hover { background: #ff8fb8; }

        .cat-title {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #ff4d8d;
            margin: 8px 0 2px 0;
            letter-spacing: 0.5px;
        }
        .cat-title:first-child { margin-top: 0; }

        .food-item {
            display: inline-block;
            padding: 1px 2px;
            border-radius: 8px;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .food-item.active {
            background: #ff5c96;
            color: #fff;
            padding: 1px 8px;
            font-weight: bold;
        }

        /* ================= 新增：历史 / 黑名单 / 撒花动画 ================= */
        /* 黑名单菜品：灰掉、划线、不可点 */
        .food-item.blocked { color: #c9b6bf; text-decoration: line-through; opacity: .6; }
        .food-item { cursor: pointer; -webkit-user-select: none; user-select: none; }
        .menu-tip { font-size: 12px; color: #b98ba4; margin-top: 8px; line-height: 1.6; }

        .tool-row { display: flex; gap: 10px; margin-top: 10px; }
        .tool-row:first-child { margin-top: 0; }
        /* 更多操作：默认收起，点开才显示按钮 */
        .tools-toggle {

        // main=主食  side=配菜  drink=饮料；可在菜单管理里逐个改
        const ROLES = [
            { id: 'main',  name: '主食', icon: '🍚' },

        // ============================================================
        // 【功能】自定义菜单：存在 localStorage，可增删改
        // 存储结构：[{ name, times:[餐次id], cat:分类名, role:角色id }]
        // ============================================================
        const LS_MENU = 'dinner.menu.v2';
        const LS_MODE = 'dinner.mode.v2';   // v2：从"单点/搭配"升级成三档
        const LS_WISH = 'dinner.wish.v1';

        // 默认菜单拍平（带分类名，方便编辑器展示）
        function defaultList() {
            const out = [];
            DEFAULT_CATEGORIES.forEach(c => c.items.forEach(it => {
                out.push({ name: it.name, times: it.times.slice(), cat: c.name, role: null });
            }));
            return out;
        }

        // 按分类先给一个合理的默认角色（用户可在编辑器里改）
        function inferRole(entry) {
            if (entry.role) return entry.role;
            const n = entry.name;

            // 判定顺序很重要：主食 → 配菜/食品 → 饮品。
            // 之前先判饮品，导致「🍰 蛋糕 + 奶茶」因为含"奶茶"被当成饮品了。
            // 主食：盖饭/面/粉/包子等（"饭"结尾的菜名式样也按主食算）
            const isMain =
                /盖饭|盖浇|炒饭|米饭|饭团|卤肉饭|丼|煲仔|鸡饭|泡馍|拉面|小面|热干面|炒面|拌面|凉面|意面|肉酱面|米线|米粉|河粉|牛河|炒粉|粉丝|螺蛳粉|砂锅粥|粥|包子|小笼|汤包|生煎|煎饺|蒸饺|抄手|饺子|煎饼|肉夹馍|火烧|手抓饼|灌饼|馅饼|韭菜盒子|寿司|麦片|豆花|担担面|麻辣拌/.test(n) ||
                /饭$/.test(n.replace(/[）)]$/, '')) ||
                /牛肉饭|鸡排饭|猪脚饭|烤肉饭|鸡腿饭|咖喱饭/.test(n);
            // 配菜 / 食品：出现这些词就按"食品"处理
            const isSide = /炸鸡|汉堡|披萨|薯条|薯角|热狗|塔可|饭|面|粉|锅|烤|串|虾|鱼|肉|蛋|粥|包|饺|饼|馍|凉皮|沙拉|拼盘|关东煮|抄手|水果|酸奶|蛋糕|甜品|下午茶|可颂|鸡蛋仔|油条|肠粉|三明治|千层|泡芙|蛋挞|绿豆糕|双皮奶|豆花/.test(n);
            // 一杯饮料的关键词
            // 注意：「燕麦奶」要能匹配到，所以这里不再用"燕麦"这种会误伤的词
            const isDrinkWord = /奶茶|咖啡|拿铁|美式|豆浆|果汁|酸梅汤|柠檬茶|奶昔|热牛奶|牛奶|燕麦奶|汽水|可乐|气泡水|沙冰|冰沙|奶盖|星冰乐|杨枝甘露|烧仙草|芋泥|生椰/.test(n);
            // 品牌匹配前先去掉开头的 emoji 和空格（例如「🥤 CoCo 都可」）
            const nBare = n.replace(/^[^\p{L}\p{N}]+/u, '');
            const isDrinkBrand = /^(古茗|霸王茶姬|茶百道|百分茶|一点点|沪上阿姨|益禾堂|蜜雪冰城|书亦|CoCo|都可|喜茶|奈雪|瑞幸|星巴克|库迪)/.test(nBare);

            // 「A + B」套餐：看加号后面跟的是不是食物
            const plusIdx = n.indexOf('+');
            const afterPlus = plusIdx >= 0 ? n.slice(plusIdx + 1) : '';
            const beforePlus = plusIdx >= 0 ? n.slice(0, plusIdx) : '';
            const isDrinkPhrase = s => /奶茶|咖啡|拿铁|美式|豆浆|果汁|酸梅汤|柠檬茶|奶昔|牛奶|燕麦奶|汽水|可乐|气泡水|沙冰|冰沙|奶盖|星冰乐/.test(s);
            // 「A + B」里，谁是主角？
            //   前面是饮料、后面是食物 → 饮料为主（现磨豆浆 + 油条 = 饮品）
            //   前面是食物、后面是饮料 → 食物为主（可颂 + 拿铁 = 配菜）
            //   后面是饭/面/粉 → 主食（饭团 + 豆浆 = 主食）
            const afterIsStaple = /饭|面|粉|包|饺|饼|馍|粥|蛋/.test(afterPlus);
            const afterIsFood = /炸鸡|鸡块|鸡排|薯条|薯角|饭|面|粉|包|饺|饼|馍|串|虾|鱼|肉|蛋|粥|沙拉|拼盘|抄手|肠粉|水果|蛋糕|甜品|可颂|鸡蛋仔|关东煮/.test(afterPlus);
            const leadIsDrink = isDrinkPhrase(beforePlus);

            const drinkish = (isDrinkWord || isDrinkBrand) &&
                (plusIdx < 0 || (leadIsDrink && !afterIsStaple));

            if (isMain) return 'main';
            if (plusIdx >= 0) {
                if (leadIsDrink && !afterIsStaple) return 'drink';   // 豆浆 + 油条
                return afterIsFood || isSide ? 'side' : (drinkish ? 'drink' : 'side');
            }
            if (isSide) return 'side';
            if (drinkish) return 'drink';
            return 'side';
        }

        function loadMenu() {
            let arr = null;
            try { arr = JSON.parse(localStorage.getItem(LS_MENU) || 'null'); } catch (e) {}
            if (!Array.isArray(arr) || arr.length === 0) arr = defaultList();
            // 规整每条：缺字段补齐
            return arr
                .filter(it => it && typeof it.name === 'string' && it.name.trim())
                .map(it => ({
                    name: it.name,
                    times: Array.isArray(it.times) && it.times.length ? it.times : ['lunch', 'dinner'],
                    cat: it.cat || '🍽 其他',
                    role: it.role || null,
                }));
        }

        MENU.forEach(e => { e.role = inferRole(e); });

        function normName(s) {
            return String(s)
                .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu, '')
                .replace(/[\s·・、,，.。\/／+＋\-—_()（）【】\[\]]/g, '')
                .toLowerCase();
        }

        // 从 MENU 重新构建 CATEGORIES（清单展示用）与 FOODS（抽签用）
        let CATEGORIES = [];

            CATEGORIES = [];

            MENU.forEach(e => {
                let c = CATEGORIES.find(x => x.name === e.cat);

                const item = { name: e.name, times: e.times, role: e.role, cat: e.cat };
                c.items.push(item);
                FOODS.push(item);
            });

        try { wishList = JSON.parse(localStorage.getItem(LS_WISH) || '[]') || []; } catch (e) { wishList = []; }

                    const cls = 'food-item' + (isBlocked(i) ? ' blocked' : '');
                    const mark = eat > 0 ? '<sup>×' + eat + '</sup>' : '';
                    cells.push('<span class="' + cls + '" data-i="' + i + '" title="点一下 = 不吃这道">' + f.name + mark + '</span>');
                });
                if (cells.length === 0) return;                             // 空分类也不显示
                html += '<span class="cat-title">' + cat.name + '</span>' + cells.join(' 、 ') + '<br>';
            });
            renderMealHint();
            menuList.innerHTML = html || (
                '<svg class="bunny-empty" width="64" height="60" viewBox="0 0 64 60" aria-hidden="true">' +
                  '<ellipse cx="24" cy="15" rx="4.5" ry="12" fill="#ffffff" stroke="#ff9ec7" stroke-width="2.5" transform="rotate(-14 24 15)"/>' +
                  '<ellipse cx="40" cy="15" rx="4.5" ry="12" fill="#ffffff" stroke="#ff9ec7" stroke-width="2.5" transform="rotate(14 40 15)"/>' +
                  '<ellipse cx="24" cy="16" rx="2" ry="7" fill="#ffd0e4" transform="rotate(-14 24 16)"/>' +
                  '<ellipse cx="40" cy="16" rx="2" ry="7" fill="#ffd0e4" transform="rotate(14 40 16)"/>' +
                  '<circle cx="32" cy="40" r="16" fill="#ffffff" stroke="#ff9ec7" stroke-width="2.5"/>' +
                  '<circle cx="26" cy="38" r="2" fill="#d63c7c"/><circle cx="38" cy="38" r="2" fill="#d63c7c"/>' +
                  '<ellipse cx="32" cy="45" rx="2.4" ry="1.8" fill="#ff9ec7"/>' +
                '</svg>' +
                '<span class="empty-tip">这个餐次暂时没有可选的了，换一个餐次试试</span>'
            );
            updateCount();
        }
        // ================= 状态：必须在任何函数调用之前初始化 =================
        // 原脚本在这一行就会调用 renderMenu()，所以历史/黑名单状态必须声明在它前面，
        // 否则在 let 的「暂时性死区」里访问会抛 ReferenceError（页面白屏）。
        const LS_HISTORY  = 'dinner.history.v1';
        const LS_BLOCKED  = 'dinner.blocked.v1';
        const HISTORY_MAX = 500;   // 最多保留 500 条，避免 localStorage 无限增长

        function jsonLoad(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                if (raw === null) return fallback;
                const val = JSON.parse(raw);
                return (val === null || val === undefined) ? fallback : val;
            } catch (e) { return fallback }
        }
        function jsonSave(key, val) {
            try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
        }

        // 【功能1】历史记录：[{ t: 时间戳, n: 菜名, i: 在 FOODS 里的下标 }]
        let historyList = jsonLoad(LS_HISTORY, []);
        if (!Array.isArray(historyList)) historyList = [];

        // 【功能3】黑名单：按「菜名」存。
        // 早先是按下标存，菜单一改就全串位了；按名字存更稳，也方便你以后加菜。
        let blocked = jsonLoad(LS_BLOCKED, []);
        if (!Array.isArray(blocked)) blocked = [];
        const isBlocked = i => FOODS[i] && blocked.indexOf(FOODS[i].name) >= 0;


        // ================= 餐次：完全按北京时间判定 =================
        // 没有「手动选择」这个东西了，也不再往 localStorage 存餐次——
        // 每次打开 / 每次回到页面，都重新按北京时间算一遍，永远和你当前的时间一致。

        // 北京时间（UTC+8），不依赖手机时区设置，避免设备时区不对判错餐次
        function beijingNow() { return new Date(Date.now() + 8 * 3600 * 1000); }
        function beijingHour() { return beijingNow().getUTCHours() + beijingNow().getUTCMinutes() / 60; }
        function beijingDay() { return beijingNow().toISOString().slice(0, 10); }   // 'YYYY-MM-DD'

        function currentMealId() {
            const h = beijingHour();
            if (h >= 5 && h < 10.5)  return 'breakfast';
            if (h >= 10.5 && h < 14.5) return 'lunch';
            if (h >= 14.5 && h < 16)  return 'tea';
            if (h >= 16 && h < 22)    return 'dinner';
            return 'night';
        }

        function mealFoods(mealId) {
            return FOODS.filter(f => f.times.indexOf(mealId) >= 0);
        }

        // 【功能2】加权抽签参数
        const COOLDOWN_DAYS = 3;    // 3 天内吃过的直接不参与
        const FRESH_DAYS    = 21;   // 超过 21 天没吃，权重封顶
        const MAX_WEIGHT    = 5;    // 权重上限（相对值）
        let lastIndex = -1;
        let rollToken = 0;
        let audioCtx = null;

        renderMenu();

        let isRunning = false;

        function setHappy(happy) {
            melodyImg.src = happy ? IMG_HAPPY : IMG_NORMAL;
            melodyBox.classList.toggle('happy', happy);
        }

        function highlight(index) {
            menuList.querySelectorAll('.food-item.active').forEach(el => el.classList.remove('active'));
            const el = menuList.querySelector('.food-item[data-i="' + index + '"]');
            if (el) {
                el.classList.add('active');
                const top = el.offsetTop - menuList.clientHeight / 2 + el.clientHeight / 2;
                menuList.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
            }
        }

        // ================= 【功能1】历史记录 =================
        function lastEaten(index) {
            const hit = historyList.find(h => h.i === index);
            return hit ? hit.t : null;
        }
        function eatenCount(index) {
            return historyList.reduce((n, h) => n + (h.i === index ? 1 : 0), 0);
        }
        function addHistory(index, name) {
            historyList.unshift({ t: Date.now(), n: name, i: index });
            if (historyList.length > HISTORY_MAX) historyList.length = HISTORY_MAX;
            jsonSave(LS_HISTORY, historyList);
            if (historyPanel && historyPanel.classList.contains('show')) renderCalendar();
            renderMenu();   // 让清单里的次标记号同步更新
        }
        function fmtWhen(ts) {
            const d = new Date(ts);
            const now = new Date();
            const day = 86400000;
            const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const that0 = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
            const days = Math.round((today0 - that0) / day);
            const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
            if (days <= 0) return '今天 ' + hm;
            if (days === 1) return '昨天 ' + hm;
            if (days < 7) return days + ' 天前';
            return (d.getMonth() + 1) + '月' + d.getDate() + '日';
        }

        // ================= 【功能3】黑名单：点菜名即可划掉 =================
        function toggleBlock(i) {
            const item = FOODS[i];
            if (!item) return;
            const at = blocked.indexOf(item.name);
            if (at >= 0) blocked.splice(at, 1);
            else blocked.push(item.name);
            jsonSave(LS_BLOCKED, blocked);
            // 统一重建清单：既保证划线样式生效，也让上方的"N 道可选"跟着更新。
            // （早先这里只对一个节点做 classList.toggle，清单本身没重建，
            //   计数就永远不会变——所以改成走 renderMenu。）
            renderMenu();
            // 如果刚划掉的正是当前抽中的结果，提示重抽
            if (at < 0 && resultDiv.dataset.current === item.name) {
                delete resultDiv.dataset.current;
                setHappy(false);
                resultDiv.classList.remove('picked');
                resultDiv.textContent = '这道菜被你划掉了，重新抽一个吧';
            }
        }

        /**
         * 把界面同步到「当前时间该吃的餐次」。
         * 只在自动模式下生效（手动模式下尊重用户选择）。
         * 启动后会调用多次、每次回到页面也会调用——这样即使某次渲染出错，
         * 下一次同步就会自愈，不会出现「诊断行说下午茶、标签却高亮早饭」这种不一致。
         */
        /**
         * 按当前北京时间渲染界面。
         * 餐次是「算出来的」，不存在需要同步的状态，所以这里只管画。
         * renderMenu() 内部会调用 currentMealId()，
         * 因此只要调用它，界面就一定和当前时间一致。
         */
        function renderCurrentMeal() {
            renderMenu();
        }

        // 清单上方那行小字：现在是哪个餐次、有几道可选
        function renderMealHint() {
            if (!mineHint) return;
            const now = currentMealId();
            const m = MEALS.find(x => x.id === now);
            let n = 0;
            for (let i = 0; i < FOODS.length; i++) {
                if (FOODS[i].times.indexOf(now) >= 0 && !isBlocked(i)) n++;
            }
            mineHint.textContent = m.icon + ' ' + m.name + '时段 · ' + n + ' 道可选' + modeInfo().tip;
        }

        // 诊断行：把「现在几点（北京）」「算出该吃哪顿」「当前显示哪顿」「自动还是手动」写出来

        // ================= 【功能2】加权抽签：越久没吃越容易被抽到 =================
        /**
         * 抽一个下标。
         * @param {string} [role]  只在这个角色里抽（main/side/drink）
         * @param {Array}  [excludeNames] 本次排除的菜名
         */
        function pickTarget(role, excludeNames) {
            const nowMeal = currentMealId();   // 每次抽签都按当前北京时间现算
            const exclude = excludeNames || [];
            const pool = [];
            for (let i = 0; i < FOODS.length; i++) {
                if (FOODS[i].times.indexOf(nowMeal) < 0) continue;       // 不属于当前餐次
                if (role && FOODS[i].role !== role) continue;           // 限定角色
                if (isBlocked(i)) continue;
                if (exclude.indexOf(FOODS[i].name) >= 0) continue;
                pool.push(i);
            }
            if (pool.length === 0) return -1;

            const now = Date.now();
            const day = 86400000;

            let candidates = pool.filter(i => {
                const last = lastEaten(i);
                return last === null || (now - last) > COOLDOWN_DAYS * day;
            });

            // 万一全都在冷却期里：放宽到「最久没吃的那一批」，保证永远抽得出来
            if (candidates.length === 0) {
                let oldest = Infinity;
                for (const i of pool) {
                    const last = lastEaten(i);
                    const t = (last === null) ? -Infinity : last;
                    if (t < oldest) oldest = t;
                }
                candidates = pool.filter(i => {
                    const last = lastEaten(i);
                    return last === null || last <= oldest + day;
                });
            }

            const weights = candidates.map(i => {
                const last = lastEaten(i);
                const days = (last === null) ? FRESH_DAYS : (now - last) / day;
                let w = Math.min(MAX_WEIGHT, Math.max(1, days / (FRESH_DAYS / MAX_WEIGHT)));
                if (eatenCount(i) === 0) w += 0.8;                 // 从没吃过的小幅加成
                if (isWished(FOODS[i].name)) w += 4;               // ★ 标了"最近想吃"的，大幅提权
                if (i === lastIndex) w = 0;                        // 绝不和上一次连着重复
                return w;
            });

            const total = weights.reduce((a, b) => a + b, 0);
            if (total <= 0) return candidates[Math.floor(Math.random() * candidates.length)];

            let r = Math.random() * total;
            for (let k = 0; k < candidates.length; k++) {
                r -= weights[k];
                if (r <= 0) return candidates[k];
            }
            return candidates[candidates.length - 1];
        }

        // ================= 【功能6】音效 / 震动 / 撒花 / 减速定格 =================
        function beep(freq, dur, vol, type) {
            try {
                if (!audioCtx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return;
                    audioCtx = new AC();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = type || 'triangle';
                o.frequency.value = freq;
                const t0 = audioCtx.currentTime;
                g.gain.setValueAtTime(0.0001, t0);
                g.gain.exponentialRampToValueAtTime(vol || 0.05, t0 + 0.01);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.06));
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start(t0);
                o.stop(t0 + (dur || 0.06) + 0.02);
            } catch (e) {}
        }
        function ding() {
            beep(880, 0.10, 0.07);
            setTimeout(() => beep(1320, 0.22, 0.06), 90);
        }
        function buzz(pattern) {
            try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
        }

        function confetti() {
            const layer = document.createElement('div');
            layer.className = 'confetti-layer';
            const glyphs = ['💗', '🎀', '✨', '🌸', '💖', '⭐'];
            const colors = ['#ff5c96', '#ffb3d1', '#ffd166', '#a0e7e5', '#ff8fb8'];
            for (let i = 0; i < 32; i++) {
                const p = document.createElement('span');
                p.className = 'confetti';
                if (Math.random() < 0.55) {
                    p.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
                    p.style.fontSize = (11 + Math.random() * 13) + 'px';
                } else {
                    p.style.width = (5 + Math.random() * 6) + 'px';
                    p.style.height = (9 + Math.random() * 9) + 'px';
                    p.style.background = colors[Math.floor(Math.random() * colors.length)];
                    p.style.borderRadius = '2px';
                }
                p.style.left = (Math.random() * 100) + 'vw';
                p.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px');
                p.style.setProperty('--rot', (Math.random() * 1080 - 540) + 'deg');
                p.style.animationDuration = (2.4 + Math.random() * 1.6) + 's';
                p.style.animationDelay = (Math.random() * 0.5) + 's';
                layer.appendChild(p);
            }
            document.body.appendChild(layer);
            setTimeout(() => layer.remove(), 4800);
        }

        // 抽签流程：先算出答案，再让老虎机减速停在它上面
        /**
         * 算出这一轮要展示的答案：
         *  - 单点：只抽一个
         *  - 搭配：主食 + 配菜 + 饮料，哪一类有就抽哪一类（都没有就退回单点）
         * 返回 [{idx, role}]，失败返回 []
         */
        function computeTargets() {
            if (drawMode === 'single') {
                const one = pickTarget();
                return one < 0 ? [] : [{ idx: one, role: FOODS[one].role }];
            }
            // 加饮品模式：抽一样主菜（当前餐次里随机），再配一杯饮品
            const picked = [];
            const usedNames = [];
            const main = pickTarget(null, usedNames);
            if (main >= 0) { picked.push({ idx: main, role: FOODS[main].role }); usedNames.push(FOODS[main].name); }
            const drink = pickAnyDrink(usedNames);   // 饮品不限餐次
            if (drink >= 0) { picked.push({ idx: drink, role: 'drink' }); usedNames.push(FOODS[drink].name); }
            if (picked.length === 0) return [];
            return picked;
        }

        /** 从「全部饮品」里按权重抽一个（不受当前餐次限制），排除已选的 */
        function pickAnyDrink(excludeNames) {
            const now = Date.now();
            const day = 86400000;
            const exclude = excludeNames || [];
            let pool = [];
            for (let i = 0; i < FOODS.length; i++) {
                if (FOODS[i].role !== 'drink') continue;
                if (isBlocked(i)) continue;
                if (exclude.indexOf(FOODS[i].name) >= 0) continue;
                pool.push(i);
            }
            if (pool.length === 0) return -1;
            // 先按冷却期过滤，冷了就给权重
            let cands = pool.filter(i => {
                const last = lastEaten(i);
                return last === null || (now - last) > COOLDOWN_DAYS * day;
            });
            if (cands.length === 0) cands = pool;
            const weights = cands.map(i => {
                const last = lastEaten(i);
                const days = (last === null) ? FRESH_DAYS : (now - last) / day;
                let w = Math.min(MAX_WEIGHT, Math.max(1, days / (FRESH_DAYS / MAX_WEIGHT)));
                if (eatenCount(i) === 0) w += 0.8;
                if (isWished(FOODS[i].name)) w += 4;
                return w;
            });
            const total = weights.reduce((a, b) => a + b, 0);
            if (total <= 0) return cands[Math.floor(Math.random() * cands.length)];
            let r = Math.random() * total;
            for (let k = 0; k < cands.length; k++) { r -= weights[k]; if (r <= 0) return cands[k]; }
            return cands[cands.length - 1];
        }

        function roll() {
            if (isRunning) return;

            const targets = computeTargets();
            if (targets.length === 0) {
                setHappy(false);
                resultDiv.textContent = '这个餐次暂时没得选了，先去"菜单管理"加点菜吧';
                return;
            }
            const target = targets[0].idx;   // 老虎机滚动的落点用第一个

            const token = ++rollToken;
            isRunning = true;
            setHappy(false);
            resultDiv.classList.remove('picked');
            resultDiv.classList.remove('combo');
            resultDiv.classList.add('rolling');
            resultDiv.dataset.current = FOODS[target].name;
            btn.classList.add('btn-frozen');
            btn.textContent = '美乐蒂正在挑选...';

            const STEPS = 30;
            let n = 0;

            (function step() {
                if (token !== rollToken) return;   // 页面切走/重抽过，放弃这一轮

                let idx;
                if (n >= STEPS) {
                    idx = target;                  // 最后一步必定落在算好的答案上
                } else {
                    let guard = 0;
                    do {
                        idx = Math.floor(Math.random() * FOODS.length);
                        guard++;
                    } while ((idx === lastIndex || isBlocked(idx) ||
                              FOODS[idx].times.indexOf(currentMealId()) < 0) && guard < 300);
                }
                lastIndex = idx;
                resultDiv.textContent = FOODS[idx].name;
                highlight(idx);
                beep(560, 0.025, 0.022, 'square');

                n++;
                if (n > STEPS) {
                    isRunning = false;
                    resultDiv.classList.remove('rolling');
                    resultDiv.classList.add('picked');
                    btn.classList.remove('btn-frozen');
                    btn.textContent = drawMode === 'single' ? '不满意？再选一次！' : '不满意？换一套！';

                    setHappy(true);

                    // 每个结果都记进历史（"避免重复"的加权依赖它）
                    targets.forEach(t => addHistory(t.idx, FOODS[t.idx].name));

                    // 单点：只显示菜名；搭配：按角色分行显示
                    if (targets.length <= 1) {
                        resultDiv.textContent = FOODS[targets[0].idx].name;
                    } else {
                        resultDiv.classList.add('combo');
                        resultDiv.innerHTML = targets.map(t =>
                            '<span class="combo-line"><i>' + (t.role === 'drink' ? '🥤 饮品' : '🍽 主菜') + '</i>' +
                            FOODS[t.idx].name + '</span>'
                        ).join('');
                    }

                    ding();
                    buzz([18, 40, 28]);
                    confetti();

                    return;
                }

                const p = n / STEPS;
                setTimeout(step, 42 + 230 * Math.pow(p, 2.6));   // 越到后面越慢
            })();
        }

        // ================= 清单 / 历史面板的渲染 =================
        // ================= 最近吃过：按日期查看 =================
        /** 按「北京时间的年月日」把历史分组：{ '2026-10-13': [{t,n}, ...] } */
        function groupByDay() {
            const map = {};
            historyList.forEach(h => {
                const d = new Date(h.t + 8 * 3600 * 1000);
                const key = d.getUTCFullYear() + '-' +
                    String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getUTCDate()).padStart(2, '0');
                (map[key] || (map[key] = [])).push(h);
            });
            return map;
        }

        /** 按小时判断属于哪个餐次（与抽签同一套时段规则） */
        function mealIdByHour(h) {
            if (h >= 5 && h < 10.5) return 'breakfast';
            if (h >= 10.5 && h < 14.5) return 'lunch';
            if (h >= 14.5 && h < 16) return 'tea';
            if (h >= 16 && h < 22) return 'dinner';
            return 'night';
        }

        let hcYear = 0;      // 当前选中的年份
        let hcMonth = 0;     // 当前选中的月份（1-12）
        let hcDay = '';      // 当前选中的日期 'YYYY-MM-DD'

        /** 有记录的日期集合，用来标注日历与下拉框 */
        function hasData(key, groups) {
            if (key.length === 4) return Object.keys(groups).some(k => k.slice(0, 4) === key);
            if (key.length === 7) return Object.keys(groups).some(k => k.slice(0, 7) === key);
            return !!groups[key];
        }

        /** 重建年月下拉框 */
        function renderPicker(groups) {
            const nowBJ = beijingNow();
            if (!hcYear) hcYear = nowBJ.getUTCFullYear();
            if (!hcMonth) hcMonth = nowBJ.getUTCMonth() + 1;

            // 年份：有记录的年份 + 今年（去重排序）
            const years = {};
            years[nowBJ.getUTCFullYear()] = 1;
            Object.keys(groups).forEach(k => { years[Number(k.slice(0, 4))] = 1; });
            const yList = Object.keys(years).map(Number).sort();
            if (yList.indexOf(hcYear) < 0) yList.push(hcYear);
            hcYearSel.innerHTML = yList.sort().map(y =>
                '<option value="' + y + '"' + (y === hcYear ? ' selected' : '') + '>' + y + ' 年' +
                (hasData(String(y), groups) ? '' : '（无记录）') + '</option>'
            ).join('');

            hcMonthSel.innerHTML = Array.from({ length: 12 }, (_, i) => i + 1).map(m => {
                const key = hcYear + '-' + String(m).padStart(2, '0');
                const days = Object.keys(groups).filter(k => k.slice(0, 7) === key).length;
                return '<option value="' + m + '"' + (m === hcMonth ? ' selected' : '') + '>' +
                       m + ' 月' + (days ? ' · ' + days + ' 天有记录' : '') + '</option>';
            }).join('');
        }

        /** 画当前选中月份的日历格子 */
        function renderMonthGrid(groups) {
            const nowBJ = beijingNow();
            const todayKey = nowBJ.getUTCFullYear() + '-' +
                String(nowBJ.getUTCMonth() + 1).padStart(2, '0') + '-' +
                String(nowBJ.getUTCDate()).padStart(2, '0');
            const days = new Date(Date.UTC(hcYear, hcMonth, 0)).getUTCDate();
            const lead = (new Date(Date.UTC(hcYear, hcMonth - 1, 1)).getUTCDay() + 6) % 7;   // 周一起

            let cells = '';
            for (const w of ['一', '二', '三', '四', '五', '六', '日']) {
                cells += '<span class="hc-wd">' + w + '</span>';
            }
            for (let i = 0; i < lead; i++) cells += '<span class="hc-d"></span>';
            let monthHasData = false;
            for (let d = 1; d <= days; d++) {
                const key = hcYear + '-' + String(hcMonth).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                const had = !!groups[key];
                if (had) monthHasData = true;
                const cls = 'hc-d' + (had ? ' has' : '') + (key === todayKey ? ' today' : '') +
                            (key === hcDay ? ' sel' : '');
                cells += '<span class="' + cls + '" data-day="' + key + '">' + d + '</span>';
            }
            hcGrid.innerHTML = '<div class="hc-grid">' + cells + '</div>' +
                (monthHasData ? '' : '<div class="hc-nodata">这个月还没有记录</div>');
        }

        /** 展开某一天吃了什么 */
        function renderDayDetail(dayKey, groups) {
            groups = groups || groupByDay();
            const list = (groups[dayKey] || []).slice().sort((a, b) => b.t - a.t);
            const mmdd = dayKey ? (Number(dayKey.slice(5, 7)) + ' 月 ' + Number(dayKey.slice(8, 10)) + ' 日') : '';
            if (!hcDetail) return;
            if (!list.length) {
                hcDetail.innerHTML = '<div class="hc-dtitle">' + mmdd + '</div>' +
                    '<div class="hc-empty">这天没有记录</div>';
            } else {
                hcDetail.innerHTML = '<div class="hc-dtitle">' + mmdd + ' 吃了 ' + list.length + ' 样</div>' +
                    list.map(h => {
                        const d = new Date(h.t + 8 * 3600 * 1000);
                        const hm = String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
                        const meal = mealIdByHour(d.getUTCHours() + d.getUTCMinutes() / 60);
                        return '<div class="hc-row"><span class="t">' + hm + ' ' +
                               (MEAL_NAME[meal] || '') + '</span><span class="n">' + h.n + '</span></div>';
                    }).join('');
            }
        }

        /** 整体刷新（下拉 + 格子 + 详情） */
        function renderHistoryView() {
            const groups = groupByDay();
            renderPicker(groups);
            renderMonthGrid(groups);
            hcDay = '';
            // 默认选中：本月有记录的最后一天；否则本月今天；再否则不选
            const nowBJ = beijingNow();
            if (hcYear === nowBJ.getUTCFullYear() && hcMonth === nowBJ.getUTCMonth() + 1) {
                const todayKey = hcYear + '-' + String(hcMonth).padStart(2, '0') + '-' + String(nowBJ.getUTCDate()).padStart(2, '0');
                if (groups[todayKey]) hcDay = todayKey;
            }
            if (!hcDay) {
                const inMonth = Object.keys(groups).filter(k => k.slice(0, 7) === hcYear + '-' + String(hcMonth).padStart(2, '0')).sort();
                if (inMonth.length) hcDay = inMonth[inMonth.length - 1];
            }
            renderMonthGrid(groups);
            renderDayDetail(hcDay || (hcYear + '-' + String(hcMonth).padStart(2, '0') + '-01'), groups);
        }

        function openHistory() {
            const nowBJ = beijingNow();
            const groups = groupByDay();
            // 打开时定位到「有记录的最近一个月」，没有就看本月
            const keys = Object.keys(groups).sort();
            const last = keys[keys.length - 1];
            if (last) { hcYear = Number(last.slice(0, 4)); hcMonth = Number(last.slice(5, 7)); }
            else { hcYear = nowBJ.getUTCFullYear(); hcMonth = nowBJ.getUTCMonth() + 1; }
            renderHistoryView();
            historyPanel.classList.add('show');
        }

        // 清单上不再显示数量了，这里保留函数名只做一件事：同步"上次抽到"那行小字
        function updateCount() {
            if (!historyList.length) { foodCount.textContent = ''; return; }
            foodCount.textContent = '上次抽到：' + fmtWhen(historyList[0].t);
        }

        historyBtn.addEventListener('click', openHistory);
        if (btnHistoryClose) btnHistoryClose.addEventListener('click', () => historyPanel.classList.remove('show'));
        if (historyPanel) {
            // 点遮罩空白处关闭
            historyPanel.addEventListener('click', (ev) => { if (ev.target === historyPanel) historyPanel.classList.remove('show'); });

            // 换年 / 换月 → 重画格子
            hcYearSel.addEventListener('change', () => {
                hcYear = Number(hcYearSel.value);
                hcDay = '';
                const g = groupByDay();
                renderPicker(g);
                renderMonthGrid(g);
                // 该月有记录就自动展开最近一天
                const inMonth = Object.keys(g).filter(k => k.slice(0, 7) === hcYear + '-' + String(hcMonth).padStart(2, '0')).sort();
                hcDay = inMonth.length ? inMonth[inMonth.length - 1] : '';
                renderMonthGrid(g);
                renderDayDetail(hcDay || (hcYear + '-' + String(hcMonth).padStart(2, '0') + '-01'), g);
            });
            hcMonthSel.addEventListener('change', () => {
                hcMonth = Number(hcMonthSel.value);
                hcDay = '';
                const g = groupByDay();
                const inMonth = Object.keys(g).filter(k => k.slice(0, 7) === hcYear + '-' + String(hcMonth).padStart(2, '0')).sort();
                hcDay = inMonth.length ? inMonth[inMonth.length - 1] : '';
                renderMonthGrid(g);
                renderDayDetail(hcDay || (hcYear + '-' + String(hcMonth).padStart(2, '0') + '-01'), g);
            });

            // 点某个有记录的日期
            hcGrid.addEventListener('click', (ev) => {
                const t = ev.target;
                if (!t || !t.dataset || !t.dataset.day) return;
                if (!t.classList.contains('has')) return;
                hcDay = t.dataset.day;
                renderMonthGrid(groupByDay());
                renderDayDetail(hcDay);
            });
        }

        // 长按「恢复不吃」1.5 秒 = 清空全部本地数据（黑名单 + 历史 + 餐次记录）
        // 排障用：如果餐次显示不对，长按一下，它会自动刷新并回到干净的自动模式
        let resetHoldTimer = null;
        let resetLongPressed = false;
        function startResetHold() {
            resetLongPressed = false;
            resetHoldTimer = setTimeout(() => {
                resetLongPressed = true;
                try {
                    localStorage.removeItem(LS_BLOCKED);
                    localStorage.removeItem(LS_HISTORY);
                    // 餐次不再存本地，无需清理
                } catch (e) {}
                blocked = [];
                historyList = [];
                resetBtn.textContent = '🧹 已清空，正在刷新';
                setTimeout(() => { window.location.reload(); }, 700);
            }, 1500);
        }
        function cancelResetHold() {
            if (resetHoldTimer) { clearTimeout(resetHoldTimer); resetHoldTimer = null; }
        }
        ['mousedown', 'touchstart'].forEach(ev => resetBtn.addEventListener(ev, startResetHold));
        ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(ev => resetBtn.addEventListener(ev, cancelResetHold));

        resetBtn.addEventListener('click', () => {
            if (resetLongPressed) { resetLongPressed = false; return; }   // 长按触发的不再走单击逻辑
            if (blocked.length === 0) {
                resetBtn.textContent = '♻️ 没有划掉的菜';
                setTimeout(() => { resetBtn.textContent = '♻️ 恢复不吃'; }, 1200);
                return;
            }
            if (!window.confirm('把划掉的 ' + blocked.length + ' 道菜全部恢复？')) return;
            blocked = [];
            jsonSave(LS_BLOCKED, blocked);
            renderMenu();
        });

        menuList.addEventListener('click', (e) => {
            const item = e.target && e.target.closest ? e.target.closest('.food-item') : null;
            if (!item) return;
            toggleBlock(Number(item.dataset.i));
        });

        // 启动就同步一次：内部会无条件渲染标签栏 / 清单 / 诊断行
        renderCurrentMeal();
        // 兜底：万一首个渲染发生在 DOM 就绪之前，再补一次（任何失败都不影响主流程）
        try {
            if (typeof requestAnimationFrame === 'function') {
                requestAnimationFrame(() => { try { renderCurrentMeal(); } catch (e) {} });
            }
        } catch (e) {}

        btn.addEventListener('click', roll);


        // ============================================================
        // 【功能】菜单管理：增 / 删 / 改，全部存本机
        // ============================================================
        function renderMealCheckboxes(checked) {
            const sel = checked || [];
            mmMeals.innerHTML = MEALS.map(m =>
                '<label><input type="checkbox" value="' + m.id + '"' +
                (sel.indexOf(m.id) >= 0 ? ' checked' : '') + '>' + m.icon + m.name + '</label>'
            ).join('');
        }

        function renderRoleSelect(current) {
            mmRole.innerHTML = ROLES.map(r => '<option value="' + r.id + '">' + r.icon + ' ' + r.name + '</option>').join('');
            if (current) mmRole.value = current;
        }

        /** 分类下拉：已有分类 + 「➕ 新建分类」 */
        function renderCatOptions() {
            if (!mmCatSel) return;
            const cats = [];
            MENU.forEach(e => { if (cats.indexOf(e.cat) < 0) cats.push(e.cat); });
            mmCatSel.innerHTML = cats.map(c =>
                '<option value="' + c + '">' + c + '</option>'
            ).join('') + '<option value="__new__">➕ 新建分类…</option>';
        }

        /** 分类下拉变化：选到「新建」就露出输入框 */
        function onCatChange() {
            if (!mmCatSel) return;
            if (mmCatSel.value === '__new__') {
                mmCat.style.display = '';
                mmCat.value = '';
                mmCat.focus();
            } else {
                mmCat.style.display = 'none';
                mmCat.value = '';
            }
        }

        /** 把某道菜的分类回填到下拉（没有这个分类就新建） */
        function setCatValue(cat) {
            if (!mmCatSel) return;
            const has = mmCatSel.innerHTML.indexOf('value="' + cat + '"') >= 0;
            if (has) {
                mmCatSel.value = cat;
                mmCat.style.display = 'none';
                mmCat.value = '';
            } else {
                mmCatSel.value = '__new__';
                mmCat.style.display = '';
                mmCat.value = cat || '';
            }
        }

        /** 重画管理弹窗里的清单（按分类归组） */
        function renderManagerList() {
            if (!mmList) return;
            if (MENU.length === 0) {
                mmList.innerHTML = '<div class="mm-empty">还没有菜，上面添加几道吧</div>';
                return;
            }
            const groups = [];
            MENU.forEach((e, i) => {
                let g = groups.find(x => x.cat === e.cat);
                if (!g) { g = { cat: e.cat, items: [] }; groups.push(g); }
                g.items.push({ e: e, i: i });
            });
            let out = '';
            groups.forEach(g => {
                out += '<div class="mm-cat">' + g.cat + '（' + g.items.length + '）</div>';
                g.items.forEach(pair => {
                    const e = pair.e, i = pair.i;
                    const mealNames = e.times.map(t => (MEALS.find(m => m.id === t) || {}).name || t).join('/');
                    out += '<div class="mm-item">' +
                        '<span class="mm-name">' + e.name + '</span>' +
                        '<span class="mm-meta">' + roleIcon(e.role) + ROLE_NAME[e.role] + ' · ' + mealNames + '</span>' +
                        '<button type="button" class="mm-edit" data-edit="' + i + '">改</button>' +
                        '<button type="button" class="mm-del" data-del="' + i + '">删</button>' +
                        '</div>';
                });
            });
            mmList.innerHTML = out;
        }

        function resetForm() {
            editIndex = -1;
            mmName.value = '';
            mmCat.value = '';
            renderCatOptions();
            // 分类下拉复位到第一项（用 value 兜底，避免依赖 options 属性）
            if (mmCatSel) {
                const firstOpt = mmCatSel.querySelector ? mmCatSel.querySelector('option') : null;
                mmCatSel.value = firstOpt ? firstOpt.value : '';
                if (!mmCatSel.value && mmCatSel.innerHTML) {
                    const m = /value="([^"]*)"/.exec(mmCatSel.innerHTML);
                    if (m) mmCatSel.value = m[1];
                }
            }
            mmCat.style.display = 'none';
            renderRoleSelect('main');
            renderMealCheckboxes([currentMealId()]);
            if (mmAdd) mmAdd.textContent = '＋ 添加';
        }

        function openManager() {
            if (mmAlert) mmAlert.classList.remove('show');
            renderCatOptions();
            resetForm();
            renderManagerList();
            menuManager.classList.add('show');
        }
        function closeManager() { menuManager.classList.remove('show'); }

        function readForm() {
            const name = (mmName.value || '').trim();
            const times = [...mmMeals.querySelectorAll('input:checked')].map(x => x.value);
            // 分类：下拉选了"新建"就用输入框的内容，否则用下拉选中的分类
            let cat = '';
            if (mmCatSel && mmCatSel.value === '__new__') cat = (mmCat.value || '').trim();
            else if (mmCatSel) cat = mmCatSel.value;
            else cat = (mmCat.value || '').trim();
            return {
                name: name,
                times: times,
                cat: cat || '🍽 其他',
                role: mmRole.value || 'main',
            };
        }

        /** 菜单改动后统一收尾：保存 → 重建 → 重画 → 清理孤儿记录 */
        function applyMenuChange() {
            saveMenu();
            rebuild();
            renderMenu();
            renderManagerList();
            renderCatOptions();
            // 历史 / 黑名单按菜名存：删菜或改名后可能留下孤儿记录，顺手清掉
            const alive = {};
            MENU.forEach(e => { alive[e.name] = 1; });
            const beforeB = blocked.length;
            blocked = blocked.filter(n => alive[n]);
            if (blocked.length !== beforeB) jsonSave(LS_BLOCKED, blocked);
            const beforeW = wishList.length;
            wishList = wishList.filter(n => alive[n]);
            if (wishList.length !== beforeW) saveWish();
        }

        /** 弹一条提示（2.6 秒后自动消失） */
        let mmAlertTimer = null;
        function mmSay(msg, isOk) {
            if (!mmAlert) { alert(msg); return; }
            mmAlert.textContent = msg;
            mmAlert.classList.toggle('ok', !!isOk);
            mmAlert.classList.add('show');
            if (mmAlertTimer) clearTimeout(mmAlertTimer);
            mmAlertTimer = setTimeout(() => mmAlert.classList.remove('show'), 2600);
        }

        // ---------- 更多操作：默认收起 ----------
        const btnTools = document.getElementById('btnTools');
        const toolsPanel = document.getElementById('toolsPanel');
        let toolsOpen = false;
        function setTools(open) {
            toolsOpen = !!open;
            if (btnTools) {
                btnTools.classList.toggle('open', toolsOpen);
                btnTools.setAttribute('aria-expanded', toolsOpen ? 'true' : 'false');
                const lb = document.getElementById('toolsLabel');
                if (lb) lb.textContent = toolsOpen ? '⚙️ 收起' : '⚙️ 更多操作';
            }
            if (toolsPanel) toolsPanel.classList.toggle('open', toolsOpen);
            // 展开时给 body 加类：清单会自动收短，整页不超出屏幕
            try { document.body.classList.toggle('tools-open', toolsOpen); } catch (e) {}
        }
        if (btnTools) btnTools.addEventListener('click', () => setTools(!toolsOpen));
        setTools(false);   // 初始收起

        if (mmCatSel) mmCatSel.addEventListener('change', onCatChange);

        if (btnManage) btnManage.addEventListener('click', openManager);
        if (btnManageClose) btnManageClose.addEventListener('click', closeManager);
        if (menuManager) menuManager.addEventListener('click', (ev) => { if (ev.target === menuManager) closeManager(); });

        if (mmAdd) mmAdd.addEventListener('click', () => {
            const data = readForm();
            // 逐条校验，每种失败都给明确提示（之前失败是静默的，看起来就像按钮坏了）
            if (!data.name) {
                mmSay('请先填写菜名，再点添加');
                mmName.focus();
                return;
            }
            if (data.times.length === 0) {
                mmSay('请至少勾选一个餐次（早饭 / 午饭 / …）');
                return;
            }
            const nk = normName(data.name);
            if (editIndex >= 0) {
                // 判重时忽略 emoji / 空格 / 标点，避免"🍜 牛肉面"和"牛肉面"被当成两道菜
                const dup = MENU.findIndex((e, i) => i !== editIndex && normName(e.name) === nk);
                if (dup >= 0) { mmSay('已经有「' + MENU[dup].name + '」了，换个名字吧'); return; }
                MENU[editIndex] = data;
                applyMenuChange();
                resetForm();
                mmSay('已保存修改：' + data.name, true);
            } else {
                const hit = MENU.find(e => normName(e.name) === nk);
                if (hit) { mmSay('已经有「' + hit.name + '」了，不用重复添加'); return; }
                MENU.push(data);
                applyMenuChange();
                resetForm();
                mmSay('已添加：' + data.name, true);
            }
        });

        if (mmList) mmList.addEventListener('click', (ev) => {
            const t = ev.target;
            if (!t || !t.dataset) return;
            if (t.dataset.del !== undefined) {
                const i = Number(t.dataset.del);
                if (!confirm('删除「' + MENU[i].name + '」？')) return;
                const gone = MENU[i].name;
                MENU.splice(i, 1);
                applyMenuChange();
                resetForm();
                mmSay('已删除：' + gone, true);
            } else if (t.dataset.edit !== undefined) {
                const i = Number(t.dataset.edit);
                const e = MENU[i];
                editIndex = i;
                mmName.value = e.name;
                setCatValue(e.cat);
                renderRoleSelect(e.role);
                renderMealCheckboxes(e.times);
                if (mmAdd) mmAdd.textContent = '✔ 保存修改';
                mmName.focus();
            }
        });

        if (btnResetMenu) btnResetMenu.addEventListener('click', () => {
            if (!confirm('恢复成自带的默认菜单？你添加和修改的都会丢失。')) return;
            MENU = defaultList();
            MENU.forEach(e => { e.role = inferRole(e); });
            try { localStorage.removeItem(LS_MENU); } catch (e) {}
            rebuild();
            renderMenu();
            renderManagerList();
            renderCatOptions();
            resetForm();
        });

        // ---------- 抽取方式：单点 / 搭配 ----------
        function renderModeBtn() {
            if (!btnMode) return;
            const i = MODES.findIndex(x => x.id === drawMode);
            const next = MODES[(i + 1) % MODES.length];
            btnMode.textContent = modeInfo().btn;                    // 显示当前档位
            btnMode.title = '当前：' + modeInfo().btn + '（点一下切到「' + next.btn + '」）';
        }
        if (btnMode) btnMode.addEventListener('click', () => {
            const i = MODES.findIndex(x => x.id === drawMode);
            drawMode = MODES[(i + 1) % MODES.length].id;
            try { localStorage.setItem(LS_MODE, drawMode); } catch (e) {}
            renderModeBtn();
            renderMenu();
            mmSay && null;
        });
        renderModeBtn();

        // 页面切到后台/离开时，作废正在进行的这一轮，避免回来时状态错乱
        window.addEventListener('pagehide', () => { rollToken++; });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) { rollToken++; return; }
            try { renderCurrentMeal(); } catch (e) {}   // 回到页面：跨过时段边界就自动换清单
        });
        window.addEventListener('focus', () => { try { renderCurrentMeal(); } catch (e) {} });
    </script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) { console.log('SW register failed', e); });
  });
}
</script>
</body>
</html>
